[project]
name = "mfsim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jax>=0.11.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
mfsim = "mfsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not nightly'"
markers = [
    "golden: compara com tests/golden",
    "nightly: lento; corre com -m nightly",
    "data: precisa dos npz de notebooks/data",
]
