[project]
name = "mfsim"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ipykernel>=7.4.0",
    "jax>=0.11.2",
    "jsonschema>=4.26.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
mfsim = "mfsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mfsim", "generators", "thesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not nightly'"
markers = [
    "golden: compara com tests/golden",
    "nightly: lento; corre com -m nightly",
    "data: precisa dos npz de notebooks/data",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "archive|legacy|notebooks/"
